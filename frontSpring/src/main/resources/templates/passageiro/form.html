<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="passageiroForm">
    <th:block th:replace="~{fragmentos/modal :: modal(
        ~{:: #passageiroConteudo}
    )}"></th:block>
</th:block>

<th:block th:fragment="passageiroConteudo" id="passageiroConteudo">
    <th:block th:replace="~{fragmentos/formulario :: chrome(
        ~{:: #pas-header},
        ~{:: #pas-corpo},
        ~{:: #pas-acoes},
        ${edicao} ? 'hx-put' : 'hx-post',
        ${edicao} ? @{/passageiro/{id}(id=${id})} : @{/passageiro},
        'pessoa'
    )}"></th:block>
</th:block>

<th:block id="pas-header">
    <div class="modal-header__left">
        <div class="modal-header__icon"><i class="ti ti-user"></i></div>
        <div>
            <h2 class="modal-header__titulo" th:text="${edicao} ? 'Editar Passageiro' : 'Novo Passageiro'"></h2>
            <p class="modal-header__subtitulo">Preencha os dados do passageiro</p>
        </div>
    </div>
    <button type="button" class="modal-fechar"
            onclick="document.getElementById('passageiro-form').innerHTML=''">X</button>
</th:block>

<th:block id="pas-corpo">
    <th:block th:replace="~{fragmentos/formulario :: form-group('Nome', 'nome', 'text', 'Nome Completo', true)}" />
    <th:block th:replace="~{fragmentos/formulario :: form-group('CPF', 'cpf', 'text', '000.000.000-00', true)}" />
    <th:block th:replace="~{fragmentos/formulario :: form-group('Telefone', 'telefone', 'tel', '(00) 00000-0000', true)}" />
    <th:block th:replace="~{fragmentos/formulario :: form-group('Endereço', 'endereco', 'text', 'Rua, Número, Bairro', true)}" />
    <th:block th:replace="~{fragmentos/formulario :: form-select('Tipo de Passageiro', 'tipo', ${tiposPassageiro})}" />
    <th:block th:replace="~{fragmentos/formulario :: form-combobox-busca(
        'Condição padrão (opcional)', 'condicaoPadraoId', @{/justificativas/buscar}, ${condicaoPadraoAtual}
    )}" />
</th:block>

<th:block id="pas-acoes">
    <button type="button" class="btn btn-secondary"
            onclick="document.getElementById('passageiro-form').innerHTML=''">Cancelar</button>
    <button type="submit" class="btn btn-primary"><i class="ti ti-check"></i> Salvar</button>
</th:block>

</body>
</html>
