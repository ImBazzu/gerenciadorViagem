<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{paginainicial/index :: head('Passageiros', ~{::link})}">
    <link rel="stylesheet" th:href="@{/css/passageiro/passageiro.css}">
    <link rel="stylesheet" th:href="@{/css/modal.css}">
    <link rel="stylesheet" th:href="@{/css/tabela.css}">
    <link rel="stylesheet" th:href="@{/css/formulario.css}">
</head>

<body>
<th:block th:replace="~{paginainicial/index :: base(~{::conteudo})}">
    <th:block th:fragment="conteudo">
        <div id="passageiro-form"></div>

        <header class="page-header">
            <div>
                <h1>Passageiros</h1>
                <p>Gerencie os passageiros cadastrados em todo o sistema.</p>
            </div>
            <button class="btn btn-primary"
                    hx-get="/passageiro/form"
                    hx-target="#passageiro-form"
                    hx-swap="innerHTML">
                Novo Passageiro
            </button>
        </header>

        <section class="card">
            <div class="conteudo">
                <div id="filtros-passageiro" class="inputPesquisar">
                    <input type="search" name="q" placeholder="Pesquisar por nome"
                           hx-get="/passageiro/lista"
                           hx-trigger="keyup changed delay:400ms, load, passengerUpdated from:body"
                           hx-include="#filtros-passageiro"
                           hx-target="#passageiro-lista"
                           hx-swap="innerHTML">

                    <select name="tipo" aria-label="Filtrar por tipo"
                            hx-get="/passageiro/lista"
                            hx-trigger="change, passengerUpdated from:body"
                            hx-include="#filtros-passageiro"
                            hx-target="#passageiro-lista"
                            hx-swap="innerHTML">
                        <option value="">Todos os tipos</option>
                        <option th:each="tipo : ${tiposPassageiro}"
                                th:value="${tipo.value}"
                                th:text="${tipo.label}"></option>
                    </select>
                </div>

                <div id="passageiro-lista"></div>
            </div>
        </section>
        <script th:src="@{/js/tabela.js}"></script>
    </th:block>
</th:block>
</body>
</html>
