<div th:fragment="list">
    <table class="table">
        <thead>
        <tr>
            <th>Nome</th>
            <th>CPF</th>
            <th>Telefone</th>
            <th>Endereço</th>
            <th>Classificação</th>
            <th class="col-actions">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${passageiros.content}">
            <td data-label="Nome:" th:text="${p.nome}"></td>
            <td data-label="CPF:" th:text="${p.cpf}"></td>
            <td data-label="Telefone:" th:text="${p.telefone}"></td>
            <td data-label="Endereço:" th:text="${p.endereco}"></td>
            <td data-label="Classificação:" th:text="${p.tipo?.label}"></td>
            <td data-label="Ações:" class="actions">
                <div th:replace="~{fragmentos/dropdown :: dropdown(~{:: .dropdown-menu})}">
                    <div class="dropdown-menu">
                        <button class="dropdown-item" th:hx-get="@{/passageiro/{id}/form(id=${p.id})}" hx-target="#passageiro-form" hx-swap="innerHTML">
                            <i class="ti ti-edit"></i> Editar
                        </button>
                        <button class="dropdown-item danger" th:hx-delete="@{/passageiro/{id}(id=${p.id})}" hx-confirm="Tem certeza?" hx-target="closest tr" hx-swap="delete">
                            <i class="ti ti-trash"></i> Excluir
                        </button>
                    </div>
                </div>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(passageiros.content)}" class="empty-row">
            <td colspan="6" class="empty">Nenhum passageiro encontrado.</td>
        </tr>
        </tbody>
    </table>

    <nav class="paginacao" th:if="${passageiros.totalPages > 1}" aria-label="Paginação de passageiros">
        <button class="btn btn-secondary"
                th:disabled="${passageiros.page == 0}"
                th:hx-get="@{/passageiro/lista(page=${passageiros.page - 1})}"
                hx-include="#filtros-passageiro"
                hx-target="#passageiro-lista"
                hx-swap="innerHTML">
            <i class="ti ti-chevron-left"></i> Anterior
        </button>

        <span class="paginacao-info">
        Página <strong th:text="${passageiros.page + 1}"></strong>
        de <strong th:text="${passageiros.totalPages}"></strong>
        (<span th:text="${passageiros.totalElements}"></span> resultados)
    </span>

        <button class="btn btn-secondary"
                th:disabled="${passageiros.page == passageiros.totalPages - 1}"
                th:hx-get="@{/passageiro/lista(page=${passageiros.page + 1})}"
                hx-include="#filtros-passageiro"
                hx-target="#passageiro-lista"
                hx-swap="innerHTML">
            Próxima <i class="ti ti-chevron-right"></i>
        </button>
    </nav>
</div>
