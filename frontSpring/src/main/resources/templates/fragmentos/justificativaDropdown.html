<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="itensBusca(justificativas, campo)">
    <div th:each="j : ${justificativas}"
         class="combo-option"
         th:onclick="'selecionarJustificativa(\'' + ${campo} + '\', \'' + ${j.id} + '\', \'' + ${j.descricao} + '\')'">
        <span th:text="${j.descricao}"></span>
        <span class="combo-option-tag" th:text="${j.veiculosPermitidosResumo}"></span>
    </div>
    <div th:if="${justificativas.isEmpty()}" class="combo-empty-msg">Nenhuma justificativa encontrada</div>
    <div class="combo-manage-row"
         hx-get="/justificativas/gerenciar"
         hx-target="#modal-secundario"
         hx-swap="innerHTML">
        ⚙ Gerenciar justificativas
    </div>
</th:block>

</body>
</html>
