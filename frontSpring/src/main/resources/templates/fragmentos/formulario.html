<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="chrome(cabecalho, corpo, acoes, hxMetodo, action, nomeObjeto)">
    <div class="modal-container">
        <div class="modal-header">
            <th:block th:replace="${cabecalho}" />
        </div>
        <div class="modal-body">
            <form th:object="${__${nomeObjeto}__}"
                  th:attr="__${hxMetodo}__=${action}"
                  hx-target="closest .modal-container"
                  hx-swap="outerHTML">

                <div id="error"
                     th:if="${#fields.hasErrors('global')}"
                     class="error">
                    <span th:each="erro : ${#fields.errors('global')}" th:text="${erro}"></span>
                </div>

                <th:block th:replace="${corpo}" />
                <footer class="modal-footer">
                    <th:block th:replace="${acoes}" />
                </footer>
            </form>
        </div>
    </div>
    <script th:inline="javascript">
        function aplicarMascaraTelefone(input) {
            IMask(input, { mask: '(00)00000-0000' });
        }

        function aplicarMascaraCpf(input) {
            IMask(input, { mask: '000.000.000-00' });
        }

        function aplicarMascaras(escopo) {
            escopo.querySelectorAll('input[name="telefone"]').forEach(aplicarMascaraTelefone);
            escopo.querySelectorAll('input[name="cpf"]').forEach(aplicarMascaraCpf);
        }

        document.body.addEventListener('htmx:afterSwap', function (evt) {
            aplicarMascaras(evt.detail.target);
        });

        aplicarMascaras(document);

        // ---- Combobox de busca com seleção única ----
        function selecionarJustificativa(fieldName, id, descricao) {
            document.getElementById(fieldName).value = id;

            const busca = document.getElementById(fieldName + '-busca');
            busca.value = descricao;
            busca.readOnly = true;
            busca.classList.add('combo-input--selecionado');

            document.getElementById(fieldName + '-dropdown').innerHTML = '';
            document.getElementById(fieldName + '-clear').style.display = '';
        }

        function limparCombobox(fieldName) {
            document.getElementById(fieldName).value = '';

            const busca = document.getElementById(fieldName + '-busca');
            busca.value = '';
            busca.readOnly = false;
            busca.classList.remove('combo-input--selecionado');
            busca.focus();

            document.getElementById(fieldName + '-clear').style.display = 'none';
        }
    </script>
</th:block>

<th:block th:fragment="form-group(labelText, fieldName, inputType, placeholder, required)">
    <div class="form-group"
         th:classappend="${#fields.hasErrors('__${fieldName}__')} ? 'form-group--error'">
        <label th:for="${fieldName}" th:text="${labelText}" />
        <input th:field="*{__${fieldName}__}"
               th:type="${inputType} ?: 'text'"
               th:placeholder="${placeholder}"
               th:required="${required} ?: true"
               th:errorclass="input--error"
               th:attr="aria-invalid=${#fields.hasErrors('__${fieldName}__')},
                        aria-describedby=${#fields.hasErrors('__${fieldName}__')} ? (${fieldName} + '-erro') : null" />
        <span th:if="${#fields.hasErrors('__${fieldName}__')}"
              th:id="${fieldName} + '-erro'"
              class="field-error"
              th:errors="*{__${fieldName}__}"></span>
    </div>
</th:block>

<th:block th:fragment="form-combobox-busca(labelText, fieldName, buscarUrl, selecionada)">
    <div class="form-group" th:id="${fieldName + '-wrapper'}">
        <label th:for="${fieldName + '-busca'}" th:text="${labelText}"></label>

        <!-- Campo real que vai pro backend -->
        <input type="hidden" th:field="*{__${fieldName}__}" th:id="${fieldName}" />

        <div class="combo-wrap">
            <input type="text"
                   th:id="${fieldName + '-busca'}"
                   class="combo-input"
                   th:classappend="${selecionada != null} ? 'combo-input--selecionado'"
                   placeholder="Buscar justificativa..."
                   autocomplete="off"
                   th:value="${selecionada != null} ? ${selecionada.descricao} : ''"
                   th:readonly="${selecionada != null}"
                   th:hx-get="${buscarUrl}"
                   hx-trigger="keyup changed delay:300ms"
                   th:hx-target="'#' + ${fieldName} + '-dropdown'"
                   hx-swap="innerHTML"
                   th:hx-vals="'{&quot;campo&quot;: &quot;' + ${fieldName} + '&quot;}'" />

            <button type="button"
                    class="combo-clear-btn"
                    th:id="${fieldName + '-clear'}"
                    th:style="${selecionada == null} ? 'display:none'"
                    th:onclick="'limparCombobox(\'' + ${fieldName} + '\')'">×</button>

            <div th:id="${fieldName + '-dropdown'}" class="combo-dropdown"></div>
        </div>
        <p class="field-hint">Será sugerida automaticamente em novas listas.</p>
    </div>
</th:block>

<th:block th:fragment="form-select(labelText, fieldName, options)">
    <div class="form-group"
         th:classappend="${#fields.hasErrors('__${fieldName}__')} ? 'form-group--error'">
        <label th:for="${fieldName}" th:text="${labelText}"></label>
        <select th:field="*{__${fieldName}__}" th:errorclass="input--error">
            <option value="">Selecione...</option>
            <option th:each="opt : ${options}" th:value="${opt.value}" th:text="${opt.label}"></option>
        </select>
        <span th:if="${#fields.hasErrors('__${fieldName}__')}"
              th:id="${fieldName} + '-erro'"
              class="field-error"
              th:errors="*{__${fieldName}__}"></span>
    </div>
</th:block>

</html>
