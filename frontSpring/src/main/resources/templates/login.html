<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login • Secretaria Municipal de Transporte</title>

    <link rel="stylesheet"
          th:href="@{/css/login.css}">

</head>

<body>

<div class="background-decoration">

    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>

</div>

<main class="login-page">

    <section class="login-card">

        <!-- ================================================= -->
        <!-- Cabeçalho                                         -->
        <!-- ================================================= -->

        <header class="login-header">

            <img
                    th:src="@{/images/logo.png}"
                    src="/img/logo-prefeitura.png"
                    alt="Prefeitura de Coronel João Sá"
                    class="logo">

            <h1>
                Secretaria Municipal de Transporte
            </h1>

            <p>
                Sistema de Gestão de Transporte de Pacientes
            </p>

        </header>

        <!-- ================================================= -->
        <!-- Conteúdo                                          -->
        <!-- ================================================= -->

        <section class="login-content">

            <form
                    th:action="@{/login}"
                    method="post"
                    autocomplete="off">

                <!-- Usuário -->

                <div class="form-group">

                    <label for="username">
                        Usuário
                    </label>

                    <div class="input-wrapper">

                        <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true">

                            <path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5z"/>

                        </svg>

                        <input
                                id="username"
                                type="text"
                                name="username"
                                placeholder="Digite seu usuário"
                                required
                                autofocus>

                    </div>

                </div>

                <!-- Senha -->

                <div class="form-group">

                    <label for="password">
                        Senha
                    </label>

                    <div class="input-wrapper">

                        <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true">

                            <path d="M17 8h-1V6a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2zm-7-2a2 2 0 1 1 4 0v2h-4z"/>

                        </svg>

                        <input
                                id="password"
                                type="password"
                                name="password"
                                placeholder="Digite sua senha"
                                required>

                    </div>

                </div>

                <!-- Erro -->

                <div
                        class="login-error"
                        th:if="${error}">

                    <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true">

                        <path d="M12 2 1 21h22L12 2zm0 6 1 7h-2l1-7zm0 10a1.3 1.3 0 1 1 0-2.6A1.3 1.3 0 0 1 12 18z"/>

                    </svg>

                    <span th:text="${error}"></span>

                </div>

                <button
                        type="submit"
                        class="login-button">

                    Entrar no Sistema

                </button>

            </form>

        </section>

        <!-- ================================================= -->
        <!-- Rodapé                                            -->
        <!-- ================================================= -->

        <footer class="login-footer">

            <div class="footer-divider"></div>

            <small>

                Prefeitura Municipal de Coronel João Sá • Bahia

            </small>

            <small>

                Secretaria Municipal de Transporte

            </small>

            <small class="version">

                Desenvolvido por Robert Hichert Vieira Nascimento

            </small>

        </footer>

    </section>

</main>

</body>

</html>
