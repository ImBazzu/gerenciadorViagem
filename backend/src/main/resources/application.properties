spring.application.name=Secretaria de Transporte

#Configuração do Banco de Dados
spring.datasource.password=${DB_PASSWORD}
spring.datasource.username=${DB_USER}
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_BANCO}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none

#Configuracao do Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# Nunca exibir stacktrace no JSON de erro
spring.web.error.include-stacktrace=never

#Token
api.security.token.secret = ${JWT_SECRETS}
api.security.token.assinatura= ${JWT_ASSINATURA}

api.security.origenspermitidas=http://localhost:8080

server.servlet.context-path=/api